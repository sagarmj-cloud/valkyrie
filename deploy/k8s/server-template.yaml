# One Deployment per MCP server; stamp with SERVER=<name> PORT=<port>.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-${SERVER}, namespace: valkyrie, labels: { app: mcp-${SERVER}, tier: mcp-server } }
spec:
  replicas: 2
  selector: { matchLabels: { app: mcp-${SERVER} } }
  template:
    metadata: { labels: { app: mcp-${SERVER}, tier: mcp-server } }
    spec:
      serviceAccountName: mcp-${SERVER}          # dedicated identity per server
      automountServiceAccountToken: false
      containers:
        - name: server
          image: ghcr.io/example/valkyrie-server-${SERVER}:0.1.0
          ports: [{ containerPort: ${PORT} }]
          readinessProbe: { httpGet: { path: /healthz, port: ${PORT} } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-${SERVER}, namespace: valkyrie }
spec: { selector: { app: mcp-${SERVER} }, ports: [{ port: ${PORT} }] }
